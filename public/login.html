<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080e0b"><title>Admin sign in — Shamim</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-page"><main class="admin-gate login-card"><a class="wordmark" href="/">shamim.</a><p class="eyebrow">PRIVATE ADMIN PANEL</p><h1 id="login-heading">Welcome back.</h1><p id="login-description">Sign in to manage your portfolio.</p><p id="login-status" role="status" aria-live="polite">Loading sign-in options…</p><div id="login-methods" class="login-methods" hidden><button type="button" id="password-tab" aria-pressed="true">Username &amp; password</button><button type="button" id="otp-tab" aria-pressed="false">Phone OTP</button></div><form id="password-login" hidden><label for="admin-username">Username</label><input id="admin-username" name="username" autocomplete="username" maxlength="48" required><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button class="button" type="submit">Sign in ↗</button></form><section id="otp-login" hidden><p id="otp-note"></p><button class="subtle-button" id="send-otp" type="button">Send login code</button><form id="otp-check"><label for="admin-code">Six-digit code</label><input id="admin-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required><button class="button" type="submit">Verify &amp; sign in ↗</button></form></section><form id="admin-setup" hidden><label for="setup-username">Choose your username</label><input id="setup-username" name="username" autocomplete="username" pattern="[a-zA-Z0-9_.\-]{3,48}" minlength="3" maxlength="48" required><label for="setup-password">Choose your password</label><input id="setup-password" name="password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><small>Use at least 14 characters. A long, unique passphrase works well.</small><label for="setup-confirm">Confirm your password</label><input id="setup-confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required><button class="button" type="submit">Create admin account ↗</button></form><a class="subtle-button login-back" href="/">← Back to portfolio</a></main><script src="/login.js"></script></body></html>
